<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Higher / Lower Strahl</title>
<style>
  * { box-sizing: border-box; touch-action: manipulation; }
  body {
    background-color: #121212; color: white;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh; margin: 0; padding: 20px;
  }
  .back { align-self: flex-start; color: #888; text-decoration: none; font-size: 14px; }
  h1 {
    font-size: 26px; margin: 15px 0 5px; text-align: center;
    background: linear-gradient(45deg, #00ffcc, #0077ff);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .subtitle { color: #888; font-size: 14px; margin: 0 0 15px; text-align: center; }
  .scores { color: #aaa; font-size: 15px; margin-bottom: 15px; }
  .scores b { color: #00ffcc; font-size: 18px; }
  .duel { display: flex; align-items: stretch; gap: 8px; width: 100%; max-width: 440px; }
  .card {
    flex: 1; background: #1e1e1e; border: 2px solid #333; border-radius: 16px;
    padding: 18px 10px; text-align: center; display: flex; flex-direction: column;
    justify-content: center; gap: 10px; min-height: 130px;
  }
  .card.known { border-color: #00ffcc; }
  .card .name { font-size: 17px; font-weight: 600; }
  .card .val { font-size: 22px; font-weight: 700; color: #00ffcc; }
  .card.unknown .val { color: #ffcc00; }
  .card.right { border-color: #2ecc71; }
  .card.wrong { border-color: #e74c3c; }
  .vs { align-self: center; color: #555; font-weight: 700; font-size: 13px; }
  .buttons { display: flex; gap: 10px; width: 100%; max-width: 440px; margin-top: 15px; }
  button {
    flex: 1; padding: 16px; font-size: 17px; font-weight: 600; border: none;
    border-radius: 14px; color: white; cursor: pointer;
  }
  #higher { background: #2ecc71; }
  #lower { background: #e74c3c; }
  button:disabled { opacity: 0.4; }
  #restart { background: linear-gradient(45deg, #00ffcc, #0077ff); color: #121212; margin-top: 15px; max-width: 440px; width: 100%; flex: none; }
  #message { min-height: 28px; margin: 14px 0 6px; text-align: center; font-size: 15px; color: #ddd; }
  .ray-wrap { width: 100%; max-width: 440px; background: #1e1e1e; border: 2px solid #333; border-radius: 16px; padding: 12px 0; margin-top: 6px; }
  .ray-title { text-align: center; color: #888; font-size: 12px; margin-bottom: 4px; }
  .ray { position: relative; height: 120px; margin: 0 26px; }
  .line { position: absolute; left: 0; right: 0; top: 59px; height: 3px; background: linear-gradient(90deg, #0077ff, #00ffcc); border-radius: 2px; }
  .tick { position: absolute; top: 68px; transform: translateX(-50%); font-size: 10px; color: #666; }
  .dot { position: absolute; top: 54px; width: 13px; height: 13px; margin-left: -6px; border-radius: 50%; background: #aaa; border: 2px solid #121212; }
  .dot.last { background: #ffcc00; }
  .lbl { position: absolute; transform: translateX(-50%); font-size: 11px; color: #ddd; white-space: nowrap; }
  .lbl.up { top: 30px; }
  .lbl.down { top: 90px; }
  .hint { color: #555; font-size: 11px; text-align: center; margin-top: 14px; max-width: 440px; }
</style>
</head>
<body>
<a class="back" href="index.html">← Zurück</a>
<h1>📈 Higher / Lower Strahl</h1>
<p class="subtitle">Marktwert in Mio. € – hat der nächste Spieler einen höheren oder niedrigeren Wert?</p>
<div class="scores">Serie: <b id="streak">0</b> · Rekord: <b id="best">0</b></div>

<div class="duel">
  <div class="card known" id="curCard"><div class="name" id="curName"></div><div class="val" id="curVal"></div></div>
  <div class="vs">VS</div>
  <div class="card unknown" id="nextCard"><div class="name" id="nextName"></div><div class="val" id="nextVal">?</div></div>
</div>

<div class="buttons">
  <button id="higher">⬆ Höher</button>
  <button id="lower">⬇ Niedriger</button>
</div>
<div id="message"></div>
<button id="restart" hidden>Nochmal spielen</button>

<div class="ray-wrap">
  <div class="ray-title">Strahl der bisherigen Werte (logarithmisch, Mio. €)</div>
  <div class="ray" id="ray"></div>
</div>
<p class="hint">Marktwerte sind grobe Näherungswerte und können oben in der Datei angepasst werden.</p>

<script>
// [Name, Marktwert in Mio. €, optionaler Kurzname für den Strahl]
const PLAYERS = [
  ["Erling Haaland", 200], ["Kylian Mbappé", 180], ["Jude Bellingham", 180], ["Lamine Yamal", 180],
  ["Vinícius Júnior", 150, "Vini Jr."], ["Florian Wirtz", 130], ["Jamal Musiala", 130], ["Bukayo Saka", 130],
  ["Phil Foden", 130], ["Declan Rice", 120], ["Federico Valverde", 120, "Valverde"], ["Lautaro Martínez", 110, "Lautaro"],
  ["Rodri", 110], ["Martin Ødegaard", 110, "Ødegaard"], ["Harry Kane", 100], ["Pedri", 100],
  ["Alexander Isak", 100, "Isak"], ["Khvicha Kvaratskhelia", 85, "Kvara"], ["Rafael Leão", 80, "Leão"],
  ["Victor Osimhen", 75, "Osimhen"], ["Bernardo Silva", 70], ["Trent Alexander-Arnold", 70, "Trent"],
  ["Kai Havertz", 65], ["Mohamed Salah", 60, "Salah"], ["Gavi", 60], ["Joshua Kimmich", 50, "Kimmich"],
  ["Leroy Sané", 50, "Sané"], ["Alphonso Davies", 50, "Davies"], ["Nico Schlotterbeck", 40, "Schlotterbeck"],
  ["Serge Gnabry", 40, "Gnabry"], ["Kingsley Coman", 35, "Coman"], ["Antonio Rüdiger", 30, "Rüdiger"],
  ["Virgil van Dijk", 28, "van Dijk"], ["Kevin De Bruyne", 25, "De Bruyne"], ["Heung-min Son", 25, "Son"],
  ["Granit Xhaka", 20, "Xhaka"], ["Jonathan Tah", 20, "Tah"], ["Lionel Messi", 20, "Messi"],
  ["Marc-André ter Stegen", 18, "ter Stegen"], ["Robert Lewandowski", 15, "Lewandowski"], ["Cristiano Ronaldo", 15, "Ronaldo"],
  ["Niclas Füllkrug", 15, "Füllkrug"], ["Luka Modrić", 10, "Modrić"], ["Ilkay Gündoğan", 10, "Gündoğan"],
  ["Thomas Müller", 8, "Müller"], ["Manuel Neuer", 4, "Neuer"]
];

let pool = [], cur, next, streak = 0, best = 0, placed = [], locked = false;
try { best = parseInt(localStorage.getItem('hlStrahlBest')) || 0; } catch (e) {}

const $ = id => document.getElementById(id);
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function fmt(v) { return v.toLocaleString('de-DE') + ' Mio. €'; }
function short(p) { return p[2] || p[0].split(' ').slice(-1)[0]; }
function pct(v) { const lo = Math.log(2), hi = Math.log(250); return Math.min(100, Math.max(0, (Math.log(v) - lo) / (hi - lo) * 100)); }

function drawPlayer() {
  if (!pool.length) pool = shuffle(PLAYERS.slice());
  let p = pool.pop();
  if (cur && p[0] === cur[0] && pool.length) { pool.unshift(p); p = pool.pop(); }
  return p;
}

function renderRay() {
  let h = '<div class="line"></div>';
  [2, 5, 10, 25, 50, 100, 200].forEach(t => { h += `<span class="tick" style="left:${pct(t)}%">${t}</span>`; });
  placed.forEach((p, i) => {
    const last = i === placed.length - 1;
    h += `<span class="dot ${last ? 'last' : ''}" style="left:${pct(p[1])}%"></span>`;
    if (i >= placed.length - 6) {
      h += `<span class="lbl ${i % 2 === 0 ? 'up' : 'down'}" style="left:${pct(p[1])}%">${short(p)}</span>`;
    }
  });
  $('ray').innerHTML = h;
}

function showRound() {
  $('curName').textContent = cur[0];
  $('curVal').textContent = fmt(cur[1]);
  $('nextName').textContent = next[0];
  $('nextVal').textContent = '?';
  $('curCard').className = 'card known';
  $('nextCard').className = 'card unknown';
  $('streak').textContent = streak;
  $('best').textContent = best;
  renderRay();
}

function start() {
  pool = shuffle(PLAYERS.slice());
  streak = 0; placed = []; locked = false; cur = null;
  cur = drawPlayer();
  next = drawPlayer();
  placed.push(cur);
  $('message').textContent = '';
  $('restart').hidden = true;
  $('higher').disabled = false; $('lower').disabled = false;
  showRound();
}

function guess(higher) {
  if (locked) return;
  locked = true;
  $('higher').disabled = true; $('lower').disabled = true;
  $('nextVal').textContent = fmt(next[1]);
  const ok = next[1] === cur[1] || (higher ? next[1] > cur[1] : next[1] < cur[1]);
  if (ok) {
    streak++;
    if (streak > best) { best = streak; try { localStorage.setItem('hlStrahlBest', best); } catch (e) {} }
    $('nextCard').className = 'card right';
    $('message').textContent = next[1] === cur[1] ? 'Gleicher Wert – zählt als richtig! ✅' : 'Richtig! ✅';
    $('streak').textContent = streak; $('best').textContent = best;
    placed.push(next);
    renderRay();
    setTimeout(() => {
      cur = next; next = drawPlayer();
      locked = false;
      $('higher').disabled = false; $('lower').disabled = false;
      $('message').textContent = '';
      showRound();
    }, 1300);
  } else {
    $('nextCard').className = 'card wrong';
    $('message').textContent = `Falsch! ${next[0]} liegt bei ${fmt(next[1])}. Deine Serie: ${streak}`;
    placed.push(next);
    renderRay();
    $('restart').hidden = false;
  }
}

$('higher').addEventListener('click', () => guess(true));
$('lower').addEventListener('click', () => guess(false));
$('restart').addEventListener('click', start);
start();
</script>
</body>
</html>
