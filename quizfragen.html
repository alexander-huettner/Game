<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Quizfragen</title>
<style>
  * { box-sizing: border-box; touch-action: manipulation; }
  body {
    background-color: #121212; color: white;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh; margin: 0; padding: 20px;
  }
  .back { align-self: flex-start; color: #888; text-decoration: none; font-size: 14px; }
  h1 {
    font-size: 26px; margin: 15px 0 5px; text-align: center;
    background: linear-gradient(45deg, #00ffcc, #0077ff);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .subtitle { color: #888; font-size: 14px; margin: 0 0 20px; text-align: center; }
  .panel { width: 100%; max-width: 440px; }
  .chips { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; justify-content: center; }
  .chip { padding: 10px 16px; border-radius: 20px; border: 2px solid #333; background: #1e1e1e; color: #aaa; font-size: 15px; cursor: pointer; }
  .chip.active { border-color: #00ffcc; color: #00ffcc; }
  button.main {
    width: 100%; padding: 16px; font-size: 17px; font-weight: 700; border: none; border-radius: 14px;
    background: linear-gradient(45deg, #00ffcc, #0077ff); color: #121212; cursor: pointer; margin-top: 6px;
  }
  .progress { height: 6px; background: #2a2a2a; border-radius: 3px; overflow: hidden; margin-bottom: 8px; }
  .progress div { height: 100%; width: 0; background: linear-gradient(90deg, #00ffcc, #0077ff); transition: width 0.3s; }
  .meta { display: flex; justify-content: space-between; color: #888; font-size: 13px; margin-bottom: 14px; }
  .question { background: #1e1e1e; border: 2px solid #333; border-radius: 16px; padding: 22px 18px; font-size: 20px; font-weight: 600; line-height: 1.3; margin-bottom: 14px; text-align: center; }
  .answers { display: grid; gap: 10px; }
  .ans { padding: 15px; font-size: 16px; border: 2px solid #333; border-radius: 14px; background: #1e1e1e; color: white; cursor: pointer; text-align: left; }
  .ans:active { border-color: #00ffcc; }
  .ans.right { border-color: #2ecc71; background: #173a26; }
  .ans.wrong { border-color: #e74c3c; background: #3a1a1a; }
  .ans:disabled { cursor: default; }
  #next { display: none; }
  .result { text-align: center; }
  .result .big { font-size: 56px; font-weight: 800; color: #00ffcc; margin: 10px 0; }
  .result p { color: #aaa; font-size: 16px; }
</style>
</head>
<body>
<a class="back" href="index.html">← Zurück</a>
<h1>❓ Quizfragen</h1>
<p class="subtitle">Eine Frage nach der anderen – wie viele weißt du?</p>

<div class="panel" id="startScreen">
  <div class="chips" id="cats"></div>
  <button class="main" id="startBtn">Quiz starten (10 Fragen)</button>
</div>

<div class="panel" id="gameScreen" hidden>
  <div class="progress"><div id="bar"></div></div>
  <div class="meta"><span id="count"></span><span id="score"></span></div>
  <div class="question" id="question"></div>
  <div class="answers" id="answers"></div>
  <button class="main" id="next">Weiter</button>
</div>

<div class="panel result" id="resultScreen" hidden>
  <div class="big" id="finalScore"></div>
  <p id="finalText"></p>
  <button class="main" id="again">Nochmal spielen</button>
</div>

<script>
// c = Kategorie, q = Frage, a = richtige Antwort, w = falsche Antworten
const Q = [
  {c:'Fußball', q:'Wer wurde 2014 Fußball-Weltmeister?', a:'Deutschland', w:['Argentinien','Brasilien','Spanien']},
  {c:'Fußball', q:'Wer wurde 2022 Fußball-Weltmeister?', a:'Argentinien', w:['Frankreich','Kroatien','Marokko']},
  {c:'Fußball', q:'Wer schoss das Siegtor im WM-Finale 2014?', a:'Mario Götze', w:['Thomas Müller','Miroslav Klose','André Schürrle']},
  {c:'Fußball', q:'Wer ist Rekordtorschütze der Bundesliga?', a:'Gerd Müller', w:['Robert Lewandowski','Klaus Fischer','Jupp Heynckes']},
  {c:'Fußball', q:'Welches Land hat die meisten WM-Titel?', a:'Brasilien', w:['Deutschland','Italien','Argentinien']},
  {c:'Fußball', q:'Welcher Verein gewann 2013 die Champions League in Wembley?', a:'Bayern München', w:['Borussia Dortmund','Real Madrid','FC Barcelona']},
  {c:'Fußball', q:'Wer gewann die EM 2024?', a:'Spanien', w:['England','Frankreich','Deutschland']},
  {c:'Fußball', q:'Wie heißt das Stadion von Borussia Dortmund?', a:'Signal Iduna Park', w:['Allianz Arena','Veltins-Arena','Olympiastadion']},
  {c:'Fußball', q:'Wer gewann 2018 den Ballon d\'Or?', a:'Luka Modrić', w:['Cristiano Ronaldo','Lionel Messi','Antoine Griezmann']},
  {c:'Fußball', q:'In welchem Land fand die WM 2006 statt?', a:'Deutschland', w:['Frankreich','Südafrika','Brasilien']},
  {c:'Fußball', q:'Wie viele Spieler stehen pro Mannschaft gleichzeitig auf dem Feld?', a:'11', w:['10','12','9']},
  {c:'Fußball', q:'In welchem Land fand die WM 2022 statt?', a:'Katar', w:['Russland','Saudi-Arabien','Vereinigte Arabische Emirate']},
  {c:'Fußball', q:'Welcher Verein hat die meisten deutschen Meisterschaften gewonnen?', a:'Bayern München', w:['Borussia Dortmund','1. FC Nürnberg','Borussia Mönchengladbach']},
  {c:'Fußball', q:'Wie lang ist die reguläre Spielzeit eines Fußballspiels?', a:'90 Minuten', w:['80 Minuten','100 Minuten','120 Minuten']},
  {c:'Allgemein', q:'Was ist die Hauptstadt von Australien?', a:'Canberra', w:['Sydney','Melbourne','Perth']},
  {c:'Allgemein', q:'Wie viele Kontinente gibt es (nach gängiger Zählung)?', a:'7', w:['5','6','8']},
  {c:'Allgemein', q:'Welches chemische Symbol hat Gold?', a:'Au', w:['Ag','Go','Gd']},
  {c:'Allgemein', q:'Welcher Planet ist der größte im Sonnensystem?', a:'Jupiter', w:['Saturn','Neptun','Uranus']},
  {c:'Allgemein', q:'Wer malte die Mona Lisa?', a:'Leonardo da Vinci', w:['Michelangelo','Raffael','Vincent van Gogh']},
  {c:'Allgemein', q:'Wie viele Bundesländer hat Deutschland?', a:'16', w:['14','15','17']},
  {c:'Allgemein', q:'In welchem Jahr fiel die Berliner Mauer?', a:'1989', w:['1987','1990','1991']},
  {c:'Allgemein', q:'Welches ist das schnellste Landtier?', a:'Gepard', w:['Löwe','Pferd','Antilope']},
  {c:'Allgemein', q:'Was ist die Hauptstadt von Kanada?', a:'Ottawa', w:['Toronto','Vancouver','Montreal']},
  {c:'Allgemein', q:'Wie viele Zähne hat ein erwachsener Mensch (mit Weisheitszähnen)?', a:'32', w:['28','30','36']},
  {c:'Allgemein', q:'Welches Element hat das Symbol O?', a:'Sauerstoff', w:['Gold','Osmium','Wasserstoff']}
];

const ROUNDS = 10;
let cat = 'Alle', deck = [], idx = 0, score = 0, answered = false;
const $ = id => document.getElementById(id);
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function buildCats() {
  const cats = ['Alle', ...new Set(Q.map(x => x.c))];
  $('cats').innerHTML = '';
  cats.forEach(c => {
    const b = document.createElement('button');
    b.className = 'chip' + (c === cat ? ' active' : '');
    b.textContent = c;
    b.onclick = () => { cat = c; buildCats(); };
    $('cats').appendChild(b);
  });
}

function startGame() {
  const src = Q.filter(x => cat === 'Alle' || x.c === cat);
  deck = shuffle(src.slice()).slice(0, ROUNDS);
  idx = 0; score = 0;
  $('startScreen').hidden = true; $('resultScreen').hidden = true; $('gameScreen').hidden = false;
  showQuestion();
}

function showQuestion() {
  answered = false;
  const q = deck[idx];
  $('count').textContent = `Frage ${idx + 1} / ${deck.length}`;
  $('score').textContent = `Punkte: ${score}`;
  $('bar').style.width = (idx / deck.length * 100) + '%';
  $('question').textContent = q.q;
  $('next').style.display = 'none';
  $('answers').innerHTML = '';
  shuffle([q.a, ...q.w]).forEach(opt => {
    const b = document.createElement('button');
    b.className = 'ans';
    b.textContent = opt;
    b.onclick = () => pick(b, opt);
    $('answers').appendChild(b);
  });
}

function pick(btn, opt) {
  if (answered) return;
  answered = true;
  const q = deck[idx];
  document.querySelectorAll('.ans').forEach(b => {
    b.disabled = true;
    if (b.textContent === q.a) b.classList.add('right');
  });
  if (opt === q.a) score++; else btn.classList.add('wrong');
  $('score').textContent = `Punkte: ${score}`;
  $('next').textContent = idx === deck.length - 1 ? 'Ergebnis ansehen' : 'Weiter';
  $('next').style.display = 'block';
}

function nextStep() {
  idx++;
  if (idx >= deck.length) return finish();
  showQuestion();
}

function finish() {
  $('gameScreen').hidden = true; $('resultScreen').hidden = false;
  $('finalScore').textContent = `${score} / ${deck.length}`;
  const r = score / deck.length;
  $('finalText').textContent = r === 1 ? 'Perfekt! Nichts anbrennen lassen. 🏆' : r >= 0.7 ? 'Stark gespielt! 💪' : r >= 0.4 ? 'Solide – da geht noch mehr.' : 'Nächstes Mal wird’s besser! 😅';
}

$('startBtn').onclick = startGame;
$('next').onclick = nextStep;
$('again').onclick = () => { $('resultScreen').hidden = true; $('startScreen').hidden = false; };
buildCats();
</script>
</body>
</html>
