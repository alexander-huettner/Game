<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Wer fehlt in der Elf?</title>
<style>
  * { box-sizing: border-box; touch-action: manipulation; }
  body {
    background-color: #121212; color: white;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh; margin: 0; padding: 20px;
  }
  .back { align-self: flex-start; color: #888; text-decoration: none; font-size: 14px; }
  h1 {
    font-size: 26px; margin: 15px 0 5px; text-align: center;
    background: linear-gradient(45deg, #00ffcc, #0077ff);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .subtitle { color: #888; font-size: 14px; margin: 0 0 12px; text-align: center; }
  .panel { width: 100%; max-width: 440px; }
  .meta { display: flex; justify-content: space-between; color: #888; font-size: 13px; margin-bottom: 8px; }
  .title { text-align: center; font-size: 16px; font-weight: 600; margin-bottom: 10px; color: #00ffcc; }
  .pitch {
    position: relative; width: 100%; height: 400px; border-radius: 14px; border: 2px solid #fff3;
    background: repeating-linear-gradient(180deg, #1f7a3d 0, #1f7a3d 40px, #228a44 40px, #228a44 80px);
    display: flex; flex-direction: column; justify-content: space-around; padding: 10px 0; overflow: hidden;
  }
  .pitch::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 2px; background: #fff4; }
  .pitch::after { content: ""; position: absolute; left: 50%; top: 50%; width: 80px; height: 80px; margin: -40px 0 0 -40px; border: 2px solid #fff4; border-radius: 50%; }
  .row { display: flex; justify-content: space-around; position: relative; z-index: 1; }
  .pl { width: 25%; text-align: center; }
  .shirt {
    width: 40px; height: 40px; margin: 0 auto 3px; border-radius: 50%;
    background: #1b1b1b; border: 2px solid #fff; display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 18px;
  }
  .nm { font-size: 11px; font-weight: 600; text-shadow: 0 1px 2px #000; }
  .pl.hid .shirt { background: #ffcc00; color: #121212; border-style: dashed; animation: pulse 1.2s infinite; }
  .pl.hid .nm { color: #ffcc00; }
  .pl.right .shirt { background: #2ecc71; color: #121212; border-style: solid; animation: none; }
  .pl.wrong .shirt { background: #e74c3c; border-style: solid; animation: none; }
  @keyframes pulse { 50% { transform: scale(1.1); } }
  .answers { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
  .ans { padding: 14px 8px; font-size: 15px; border: 2px solid #333; border-radius: 14px; background: #1e1e1e; color: white; cursor: pointer; }
  .ans.right { border-color: #2ecc71; background: #173a26; }
  .ans.wrong { border-color: #e74c3c; background: #3a1a1a; }
  .ans:disabled { cursor: default; }
  button.main {
    width: 100%; padding: 16px; font-size: 17px; font-weight: 700; border: none; border-radius: 14px;
    background: linear-gradient(45deg, #00ffcc, #0077ff); color: #121212; cursor: pointer; margin-top: 12px;
  }
  #next { display: none; }
  .result { text-align: center; }
  .result .big { font-size: 56px; font-weight: 800; color: #00ffcc; margin: 20px 0 10px; }
  .result p { color: #aaa; font-size: 16px; }
</style>
</head>
<body>
<a class="back" href="index.html">← Zurück</a>
<h1>🕵️ Wer fehlt in der Elf?</h1>
<p class="subtitle">Ein Spieler fehlt in der Startelf – wer war es?</p>

<div class="panel" id="gameScreen">
  <div class="meta"><span id="count"></span><span id="score"></span></div>
  <div class="title" id="title"></div>
  <div class="pitch" id="pitch"></div>
  <div class="answers" id="answers"></div>
  <button class="main" id="next">Weiter</button>
</div>

<div class="panel result" id="resultScreen" hidden>
  <div class="big" id="finalScore"></div>
  <p id="finalText"></p>
  <button class="main" id="again">Nochmal spielen</button>
</div>

<script>
// Reihen: [Torwart], [Abwehr], [Mittelfeld], [Angriff]
const L = [
  {t:'Deutschland – WM-Finale 2014', rows:[['Neuer'],['Lahm','Boateng','Hummels','Höwedes'],['Kramer','Schweinsteiger','Kroos'],['Özil','Klose','Müller']]},
  {t:'Bayern München – CL-Finale 2013', rows:[['Neuer'],['Lahm','Boateng','Dante','Alaba'],['Javi Martínez','Schweinsteiger','Müller'],['Robben','Mandžukić','Ribéry']]},
  {t:'Real Madrid – CL-Finale 2018', rows:[['Navas'],['Carvajal','Varane','Ramos','Marcelo'],['Casemiro','Modrić','Kroos'],['Isco','Benzema','Ronaldo']]},
  {t:'FC Barcelona – CL-Finale 2015', rows:[['ter Stegen'],['Alves','Piqué','Mascherano','Alba'],['Busquets','Rakitić','Iniesta'],['Messi','Suárez','Neymar']]},
  {t:'FC Liverpool – CL-Finale 2019', rows:[['Alisson'],['Alexander-Arnold','Matip','van Dijk','Robertson'],['Henderson','Fabinho','Wijnaldum'],['Salah','Firmino','Mané']]},
  {t:'Argentinien – WM-Finale 2022', rows:[['E. Martínez'],['Molina','Romero','Otamendi','Tagliafico'],['De Paul','E. Fernández','Mac Allister'],['Di María','Messi','Álvarez']]},
  {t:'Spanien – EM-Finale 2024', rows:[['Unai Simón'],['Carvajal','Le Normand','Laporte','Cucurella'],['Rodri','Fabián Ruiz','Olmo'],['Yamal','Morata','N. Williams']]}
];

const ROUNDS = 10;
let rounds = [], idx = 0, score = 0, answered = false;
const $ = id => document.getElementById(id);
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function buildRounds() {
  let order = [];
  while (order.length < ROUNDS) {
    const s = shuffle(L.map((_, i) => i));
    if (order.length && s[0] === order[order.length - 1]) s.push(s.shift());
    order = order.concat(s);
  }
  return order.slice(0, ROUNDS).map(li => {
    const l = L[li];
    const r = Math.floor(Math.random() * 4);
    const i = Math.floor(Math.random() * l.rows[r].length);
    return { l, r, i, answer: l.rows[r][i] };
  });
}

function distractors(rowIdx, lineup) {
  const own = new Set(lineup.rows.flat());
  const set = new Set();
  L.forEach(l => l.rows[rowIdx].forEach(n => { if (!own.has(n)) set.add(n); }));
  return shuffle([...set]).slice(0, 3);
}

function render(round) {
  let h = '';
  for (let r = 3; r >= 0; r--) {
    h += '<div class="row">';
    round.l.rows[r].forEach((n, i) => {
      const hidden = r === round.r && i === round.i;
      h += `<div class="pl ${hidden ? 'hid' : ''}" ${hidden ? 'id="hiddenPl"' : ''}><div class="shirt">${hidden ? '?' : ''}</div><div class="nm">${hidden ? '???' : n}</div></div>`;
    });
    h += '</div>';
  }
  $('pitch').innerHTML = h;
}

function showRound() {
  answered = false;
  const round = rounds[idx];
  $('count').textContent = `Runde ${idx + 1} / ${rounds.length}`;
  $('score').textContent = `Punkte: ${score}`;
  $('title').textContent = round.l.t;
  render(round);
  $('next').style.display = 'none';
  $('answers').innerHTML = '';
  shuffle([round.answer, ...distractors(round.r, round.l)]).forEach(opt => {
    const b = document.createElement('button');
    b.className = 'ans';
    b.textContent = opt;
    b.onclick = () => pick(b, opt);
    $('answers').appendChild(b);
  });
}

function pick(btn, opt) {
  if (answered) return;
  answered = true;
  const round = rounds[idx];
  const ok = opt === round.answer;
  if (ok) score++;
  document.querySelectorAll('.ans').forEach(b => {
    b.disabled = true;
    if (b.textContent === round.answer) b.classList.add('right');
  });
  if (!ok) btn.classList.add('wrong');
  const pl = $('hiddenPl');
  pl.classList.remove('hid');
  pl.classList.add(ok ? 'right' : 'wrong');
  pl.querySelector('.shirt').textContent = ok ? '✓' : '✗';
  pl.querySelector('.nm').textContent = round.answer;
  $('score').textContent = `Punkte: ${score}`;
  $('next').textContent = idx === rounds.length - 1 ? 'Ergebnis ansehen' : 'Weiter';
  $('next').style.display = 'block';
}

function nextStep() {
  idx++;
  if (idx >= rounds.length) return finish();
  showRound();
}

function finish() {
  $('gameScreen').hidden = true; $('resultScreen').hidden = false;
  $('finalScore').textContent = `${score} / ${rounds.length}`;
  const r = score / rounds.length;
  $('finalText').textContent = r === 1 ? 'Taktikfuchs! Alle Aufstellungen sitzen. 🏆' : r >= 0.7 ? 'Starker Fußball-Kenner! 💪' : r >= 0.4 ? 'Solide – die Klassiker gehen noch besser.' : 'Zeit, alte Finals nachzuschauen! 😅';
}

function startGame() {
  rounds = buildRounds(); idx = 0; score = 0;
  $('resultScreen').hidden = true; $('gameScreen').hidden = false;
  showRound();
}

$('next').onclick = nextStep;
$('again').onclick = startGame;
startGame();
</script>
</body>
</html>
