<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Fußball-Auktions-Draft</title>
  <style>
    * { box-sizing: border-box; touch-action: manipulation; }
    body {
      background-color: #121212;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; flex-direction: column; align-items: center;
      min-height: 100vh; margin: 0; padding: 20px;
    }
    .container { width: 100%; max-width: 600px; }
    header { text-align: center; margin-bottom: 15px; }
    h1 {
      font-size: 26px; margin: 0 0 5px 0;
      background: linear-gradient(45deg, #00ffcc, #0077ff);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .back-btn { color: #888; text-decoration: none; font-size: 14px; display: inline-block; margin-bottom: 15px; }
    
    /* Setup Modal */
    .setup-box {
      background: #1e1e1e; border: 2px solid #00ffcc; border-radius: 16px; padding: 20px; text-align: center; margin-bottom: 20px;
    }
    .setup-box select { padding: 8px 12px; font-size: 16px; border-radius: 8px; background: #121212; color: white; border: 1px solid #444; }

    /* Dashboard */
    .dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 15px; }
    .player-card {
      background: #1e1e1e; border: 2px solid #333; border-radius: 12px; padding: 10px; text-align: center;
    }
    .player-card.active { border-color: #00ffcc; box-shadow: 0 0 10px rgba(0, 255, 204, 0.3); }
    .player-card.folded { opacity: 0.4; border-color: #555; }
    .budget { font-size: 18px; font-weight: bold; color: #00ffcc; margin: 3px 0; }
    .status-badge { font-size: 10px; color: #aaa; }

    /* Auktions Box */
    .auction-box {
      background: #1e1e1e; border: 2px solid #333; border-radius: 16px; padding: 20px; text-align: center; margin-bottom: 20px;
    }
    .player-name { font-size: 26px; font-weight: bold; color: #fff; margin: 5px 0; }
    .price-display {
      font-size: 32px; font-weight: bold; color: #00ffcc; margin: 15px 0 5px 0;
      background: #121212; border-radius: 12px; padding: 10px; border: 1px solid #333;
    }
    .bid-info { font-size: 14px; color: #aaa; margin-bottom: 15px; }
    
    /* Custom Input Controls */
    .manual-bid-box {
      display: flex; gap: 8px; justify-content: center; margin-bottom: 12px;
    }
    .manual-bid-box input {
      width: 110px; padding: 10px; font-size: 16px; font-weight: bold;
      background: #121212; border: 2px solid #00ffcc; color: white;
      border-radius: 10px; text-align: center;
    }

    .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    button {
      background: #2a2a2a; border: 2px solid #00ffcc; color: white; padding: 12px 5px;
      border-radius: 10px; font-size: 14px; font-weight: bold; cursor: pointer;
    }
    button:active { transform: scale(0.96); }
    button:disabled { border-color: #444; color: #555; cursor: not-allowed; }
    button.btn-pass { border-color: #ff9900; }
    button.btn-skip { border-color: #ff4444; grid-column: span 2; }

    /* Kader */
    .squads { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
    .squad-list { background: #181818; border-radius: 8px; padding: 10px; font-size: 12px; }
    .squad-list h4 { margin: 0 0 5px 0; color: #888; }
    .squad-list ul { list-style: none; padding: 0; margin: 0; }
    .squad-list li { padding: 3px 0; border-bottom: 1px solid #222; }

    .api-key-box { margin-top: 20px; background: #1e1e1e; padding: 15px; border-radius: 12px; border: 1px solid #333; }
    .api-key-box input { width: 100%; padding: 8px; margin-top: 8px; background: #121212; border: 1px solid #444; color: white; border-radius: 6px; }
    .result-box { background: #1a2a22; border: 2px solid #00ffcc; border-radius: 12px; padding: 15px; margin-top: 15px; white-space: pre-wrap; }
  </style>
</head>
<body>

<div class="container">
  <a href="index.html" class="back-btn">← Zurück zur Übersicht</a>
  
  <header>
    <h1>⚽ Auktions-Draft</h1>
    <span id="round-counter" style="color: #888;">Setup</span>
  </header>

  <!-- Setup Box -->
  <div id="setup-area" class="setup-box">
    <h3>Anzahl der Mitspieler wählen:</h3>
    <select id="num-players">
      <option value="2">2 Spieler (je 20 € Budget)</option>
      <option value="3" selected>3 Spieler (je 30 € Budget)</option>
      <option value="4">4 Spieler (je 40 € Budget)</option>
      <option value="5">5 Spieler (je 50 € Budget)</option>
    </select>
    <br><br>
    <button onclick="startGame()">Spiel Starten</button>
  </div>

  <div id="game-container" style="display: none;">
    <!-- Dashboard Mitspieler -->
    <div id="dashboard" class="dashboard"></div>

    <!-- Auktions-Box -->
    <div id="game-area" class="auction-box">
      <div>Aktueller Fußballer:</div>
      <div id="current-player" class="player-name">---</div>
      
      <!-- Preis in der Mitte -->
      <div id="current-price" class="price-display">0.00 €</div>
      <div id="bid-info" class="bid-info">Noch keine Gebote</div>

      <!-- Manuelles Gebot -->
      <div class="manual-bid-box">
        <input type="number" id="custom-bid-input" min="1" step="1" placeholder="z.B. 10">
        <button id="btn-custom-bid" onclick="placeCustomBid()">Bieten (€)</button>
      </div>

      <div class="controls">
        <button id="btn-bid" onclick="placeStepBid()">+1.00 € Bieten</button>
        <button id="btn-pass" class="btn-pass" onclick="passBid()">Aussteigen (Passen)</button>
        <button id="btn-skip" class="btn-skip" onclick="skipPlayer()">Karte Skippen (1x pro Spiel)</button>
      </div>
    </div>

    <!-- Kader-Anzeige -->
    <div id="squads" class="squads"></div>

    <!-- Jury-Auswertung -->
    <div id="jury-section" class="api-key-box" style="display: none;">
      <h3>🤖 KI-Jury Bewertung</h3>
      <p style="font-size: 12px; color: #aaa;">Gib optional deinen OpenAI API Key ein, um eine automatische KI-Bewertung zu starten:</p>
      <input type="password" id="api-key" placeholder="sk-proj-...">
      <button onclick="evaluateJury()" style="width: 100%; margin-top: 10px;">Kader bewerten lassen</button>
      <div id="jury-result" class="result-box" style="display: none;"></div>
    </div>
  </div>
</div>

<!-- spieler.js einbinden -->
<script src="spieler.js"></script>

<script>
  let config = { numPlayers: 3, totalRounds: 15, targetSquadSize: 4 };
  let pool = [];
  let players = []; 

  let state = {
    round: 1,
    currentPlayerName: "",
    currentPrice: 0.0,
    highestBidderIndex: null,
    activeBidderIndex: 0,
    activeInRound: [], // Wer bietet in dieser Runde noch mit?
  };

  function startGame() {
    config.numPlayers = parseInt(document.getElementById('num-players').value);
    config.totalRounds = config.numPlayers * 5; // z.B. 2 Spieler = 10 Runden, 3 Spieler = 15 Runden
    
    // Pool aus spieler.js kombinieren
    const namenEinfach = SPIELER_EINFACH.map(e => e[0]);
    const namenSchwer = SPIELER_SCHWER.map(e => e[0]);
    pool = [...namenEinfach, ...namenSchwer].sort(() => Math.random() - 0.5);

    // Budget: 2 Spieler = 20€, 3 Spieler = 30€, 4 Spieler = 40€ ...
    const startBudget = config.numPlayers * 10.0;

    players = [];
    for (let i = 0; i < config.numPlayers; i++) {
      players.push({
        id: i,
        name: `Spieler ${String.fromCharCode(65 + i)}`,
        budget: startBudget,
        squad: [],
        skipsLeft: 1
      });
    }

    document.getElementById('setup-area').style.display = 'none';
    document.getElementById('game-container').style.display = 'block';

    initRound();
  }

  function initRound() {
    if (state.round > config.totalRounds || pool.length === 0) {
      endGame();
      return;
    }

    state.currentPlayerName = pool.pop();
    state.currentPrice = 0.0;
    state.highestBidderIndex = null;
    
    // Alle Spieler aktivieren
    state.activeInRound = players.map(p => true);

    // Starter-Rotation
    state.activeBidderIndex = (state.round - 1) % config.numPlayers;

    document.getElementById('custom-bid-input').value = "";

    renderDashboard();
    renderSquads();
    updateUI();
  }

  function updateUI() {
    document.getElementById('round-counter').innerText = `Runde ${state.round} / ${config.totalRounds}`;
    document.getElementById('current-player').innerText = state.currentPlayerName;
    document.getElementById('current-price').innerText = state.currentPrice.toFixed(2) + " €";

    const activeP = players[state.activeBidderIndex];
    let bidText = state.highestBidderIndex !== null 
      ? `Höchstgebot von ${players[state.highestBidderIndex].name}`
      : `Am Zug: ${activeP.name}`;
    document.getElementById('bid-info').innerText = bidText;

    // Active Highlight
    players.forEach((p, idx) => {
      const card = document.getElementById(`p-card-${idx}`);
      if (card) {
        card.classList.toggle('active', idx === state.activeBidderIndex);
        card.classList.toggle('folded', !state.activeInRound[idx]);
      }
    });

    validateControls();
  }

  function validateControls() {
    const p = players[state.activeBidderIndex];
    const nextBid = state.highestBidderIndex !== null ? state.currentPrice + 1.0 : 1.0;

    const btnBid = document.getElementById('btn-bid');
    const btnCustomBid = document.getElementById('btn-custom-bid');
    const btnPass = document.getElementById('btn-pass');
    const btnSkip = document.getElementById('btn-skip');

    // Bieten-Buttons aktivieren/deaktivieren
    btnBid.disabled = p.budget < nextBid;
    btnCustomBid.disabled = p.budget < nextBid;

    // Mindestwert für das benutzerdefinierte Gebotsfeld setzen
    const customInput = document.getElementById('custom-bid-input');
    customInput.min = Math.floor(nextBid);

    // Pflichtkauf-Prüfung
    const remainingRounds = config.totalRounds - state.round + 1;
    const needed = config.targetSquadSize - p.squad.length;
    const mustBuy = needed >= remainingRounds;
    
    btnPass.disabled = mustBuy && state.highestBidderIndex !== state.activeBidderIndex;
    btnSkip.disabled = p.skipsLeft <= 0 || mustBuy;
  }

  // Bieten in +1 € Schritten
  function placeStepBid() {
    const nextBid = state.highestBidderIndex !== null ? state.currentPrice + 1.0 : 1.0;
    executeBid(nextBid);
  }

  // Bieten per manuellem Betrag
  function placeCustomBid() {
    const input = document.getElementById('custom-bid-input');
    const amount = parseInt(input.value, 10);
    const minRequired = state.highestBidderIndex !== null ? state.currentPrice + 1.0 : 1.0;
    const p = players[state.activeBidderIndex];

    if (isNaN(amount) || amount < minRequired) {
      alert(`Bitte gib ein gültiges Gebot von mindestens ${Math.ceil(minRequired)} € ein.`);
      return;
    }

    if (amount > p.budget) {
      alert(`Du hast nur noch ${p.budget.toFixed(2)} € Budget!`);
      return;
    }

    executeBid(amount);
    input.value = "";
  }

  function executeBid(amount) {
    const pIdx = state.activeBidderIndex;
    if (players[pIdx].budget >= amount) {
      state.currentPrice = amount;
      state.highestBidderIndex = pIdx;
      nextTurn();
    }
  }

  function passBid() {
    state.activeInRound[state.activeBidderIndex] = false;

    const remainingInRound = state.activeInRound.filter(x => x).length;

    if (remainingInRound === 1 && state.highestBidderIndex !== null) {
      // Höchstbietender bekommt Zuschlag
      awardPlayer(state.highestBidderIndex);
    } else if (remainingInRound === 0 || (remainingInRound === 1 && state.highestBidderIndex === null)) {
      // Alle haben gepasst
      state.round++;
      initRound();
    } else {
      nextTurn();
    }
  }

  function skipPlayer() {
    const p = players[state.activeBidderIndex];
    if (p.skipsLeft > 0) {
      p.skipsLeft--;
      state.round++;
      initRound();
    }
  }

  function nextTurn() {
    do {
      state.activeBidderIndex = (state.activeBidderIndex + 1) % config.numPlayers;
    } while (!state.activeInRound[state.activeBidderIndex]);

    updateUI();
  }

  function awardPlayer(winnerIdx) {
    const winner = players[winnerIdx];
    winner.budget -= state.currentPrice;
    winner.squad.push(`${state.currentPlayerName} (${state.currentPrice.toFixed(2)}€)`);

    state.round++;
    initRound();
  }

  function renderDashboard() {
    const dash = document.getElementById('dashboard');
    dash.innerHTML = players.map(p => `
      <div id="p-card-${p.id}" class="player-card">
        <h3>${p.name}</h3>
        <div class="budget">${p.budget.toFixed(2)} €</div>
        <div class="status-badge">Kader: ${p.squad.length} | Skips: ${p.skipsLeft}</div>
      </div>
    `).join('');
  }

  function renderSquads() {
    const squads = document.getElementById('squads');
    squads.innerHTML = players.map(p => `
      <div class="squad-list">
        <h4>${p.name}:</h4>
        <ul>${p.squad.map(s => `<li>${s}</li>`).join('')}</ul>
      </div>
    `).join('');
  }

  function endGame() {
    document.getElementById('game-area').innerHTML = `
      <h2>🏆 Draft Beendet!</h2>
      <p>Alle Runden wurden abgeschlossen.</p>
    `;
    document.getElementById('jury-section').style.display = 'block';
  }

  async function evaluateJury() {
    const apiKey = document.getElementById('api-key').value.trim();
    const resultDiv = document.getElementById('jury-result');
    resultDiv.style.display = 'block';

    if (!apiKey) {
      resultDiv.innerText = "Bitte gib einen gültigen OpenAI API Key ein.";
      return;
    }

    resultDiv.innerText = "Die KI-Jury analysiert die Kader...";

    const squadOverview = players.map(p => `
${p.name}:
Kader: ${p.squad.join(', ') || 'Keine Spieler'}
Restbudget: ${p.budget.toFixed(2)}€
    `).join('\n');

    const prompt = `
Du bist eine neutrale Fußball-Jury.
Es wurde ein Auktions-Draft mit ${config.numPlayers} Spielern durchgeführt.

${squadOverview}

Bewertungsschema:
- Teamchemie & Kader-Balance
- Gesamtstärke der Spieler
- Preis-Leistung beim Ausgeben des Budgets

Bestimme den Gewinner und begründe die Entscheidung kurz in 3-5 Sätzen.
    `;

    try {
      const response = await fetch('https://api.openai.com/v1/chat/completions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
        body: JSON.stringify({ model: 'gpt-4o-mini', messages: [{ role: 'user', content: prompt }] })
      });

      const data = await response.json();
      resultDiv.innerText = data.choices?.[0]?.message?.content || "Fehler bei der Auswertung.";
    } catch (err) {
      resultDiv.innerText = "Fehler: " + err.message;
    }
  }
</script>

</body>
</html>
